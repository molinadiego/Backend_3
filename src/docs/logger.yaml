/api/logger/loggerTest:
    get:
        tags:
            - Logger
        summary: Probar el sistema de logging
        description: Genera registros de prueba en los diferentes niveles configurados del logger. Está disponible en los entornos development y test; en production, el middleware responde 404 y no ejecuta esta funcionalidad.
        responses:
            "200":
                description: Registros de logging generados correctamente.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SuccessResponse"
                        example:
                            status: success
                            message: "logs generados correctamente"
            "404":
                description: Ruta no encontrada cuando NODE_ENV es production; el controller no se ejecuta.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
