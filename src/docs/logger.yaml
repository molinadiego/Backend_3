/api/logger/loggertest:
    get:
        tags:
            - Logger
        summary: Probar el sistema de logging
        description: Genera registros de prueba en los diferentes niveles configurados del logger. Este endpoint se utiliza únicamente para validar el funcionamiento del sistema de logging.
        responses:
            "200":
                description: Registros de logging generados correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                message:
                                    type: string
                                    example: "logs generados correctamente"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
