/api/products:
    get:
        tags:
            - Products
        summary: Obtener todos los productos
        description: Obtiene todos los productos activos registrados en ShipNow.
        parameters:
            - name: page
              in: query
              required: false
              description: Número de página. Debe ser un entero positivo.
              schema:
                  type: integer
                  minimum: 1
                  default: 1
            - name: limit
              in: query
              required: false
              description: Cantidad de resultados por página. Debe ser un entero positivo; los valores superiores a 100 se limitan a 100.
              schema:
                  type: integer
                  minimum: 1
                  default: 10
            - name: status
              in: query
              required: false
              description: Filtra por estado del producto.
              schema:
                  type: string
                  enum:
                      - AVAILABLE
                      - OUT_OF_STOCK
        responses:
            "200":
                description: Lista de productos obtenida correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                payload:
                                    type: array
                                    items:
                                        $ref: "#/components/schemas/Product"
                                pagination:
                                    type: object
                                    properties:
                                        page:
                                            type: integer
                                            example: 1
                                        limit:
                                            type: integer
                                            example: 10
                                        total:
                                            type: integer
                                            example: 25
                                        totalPages:
                                            type: integer
                                            example: 3
            "400":
                description: Parámetros de consulta no válidos.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"

    post:
        tags:
            - Products
        summary: Crear un producto
        description: Crea un nuevo producto. El estado se determina automáticamente según el stock.
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - name
                            - price
                            - stock
                        properties:
                            name:
                                type: string
                                example: "Mouse inalámbrico"
                            price:
                                type: number
                                minimum: 0
                                example: 25.99
                            stock:
                                type: number
                                minimum: 0
                                example: 10
        responses:
            "201":
                description: Producto creado correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                data:
                                    $ref: "#/components/schemas/Product"
            "400":
                description: Datos enviados no válidos.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"

/api/products/{id}:
    get:
        tags:
            - Products
        summary: Obtener un producto por ID
        description: Obtiene un producto activo utilizando su identificador.
        parameters:
            - name: id
              in: path
              required: true
              description: Identificador del producto.
              schema:
                  type: string
                  example: "507f1f77bcf86cd799439015"
        responses:
            "200":
                description: Producto obtenido correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                data:
                                    $ref: "#/components/schemas/Product"
            "404":
                description: Producto no encontrado.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "400":
                description: Identificador no válido.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"

    put:
        tags:
            - Products
        summary: Actualizar un producto
        description: Actualiza los datos permitidos de un producto activo. El estado se recalcula si cambia el stock.
        parameters:
            - name: id
              in: path
              required: true
              description: Identificador del producto.
              schema:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        minProperties: 1
                        properties:
                            name:
                                type: string
                                example: "Mouse inalámbrico actualizado"
                            price:
                                type: number
                                minimum: 0
                                example: 29.99
                            stock:
                                type: number
                                minimum: 0
                                example: 15
        responses:
            "200":
                description: Producto actualizado correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                data:
                                    $ref: "#/components/schemas/Product"
            "400":
                description: Identificador o datos enviados no válidos.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "404":
                description: Producto no encontrado.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"

    delete:
        tags:
            - Products
        summary: Eliminar un producto
        description: Desactiva un producto mediante eliminación lógica.
        parameters:
            - name: id
              in: path
              required: true
              description: Identificador del producto.
              schema:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
        responses:
            "200":
                description: Producto desactivado correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                data:
                                    $ref: "#/components/schemas/Product"
            "400":
                description: Identificador no válido.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "404":
                description: Producto no encontrado.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"

/api/products/{id}/stock:
    patch:
        tags:
            - Products
        summary: Actualizar el stock de un producto
        description: Actualiza el stock de un producto y determina automáticamente su estado.
        parameters:
            - name: id
              in: path
              required: true
              description: Identificador del producto.
              schema:
                  type: string
                  example: "507f1f77bcf86cd799439015"
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - stock
                        properties:
                            stock:
                                type: number
                                minimum: 0
                                example: 25
        responses:
            "200":
                description: Stock actualizado correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                data:
                                    $ref: "#/components/schemas/Product"
            "400":
                description: Datos enviados no válidos.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "404":
                description: Producto no encontrado.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
