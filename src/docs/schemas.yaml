components:
    schemas:
        User:
            type: object
            properties:
                _id:
                    type: string
                    example: "507f1f77bcf86cd799439011"
                name:
                    type: string
                    example: "Juan Pérez"
                email:
                    type: string
                    format: email
                    example: "juan@example.com"
                role:
                    type: string
                    enum:
                        - admin
                        - customer
                        - driver
                        - store
                    example: customer
                isActive:
                    type: boolean
                    example: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                documents:
                    type: array
                    items:
                        $ref: "#/components/schemas/UserDocument"

        UserSummary:
            type: object
            properties:
                _id:
                    type: string
                    example: "507f1f77bcf86cd799439011"
                name:
                    type: string
                    example: "Juan Pérez"
                email:
                    type: string
                    format: email
                    example: "juan@example.com"
                role:
                    type: string
                    enum:
                        - admin
                        - customer
                        - driver
                        - store
                    example: driver

        UserDocument:
            type: object
            required:
                - originalName
                - filename
                - mimetype
                - size
                - documentType
            properties:
                _id:
                    type: string
                originalName:
                    type: string
                    example: licencia.pdf
                filename:
                    type: string
                    example: 4be103af-1ce8-4ea3-81f5-0ef9f67c5a15.pdf
                mimetype:
                    type: string
                    enum:
                        - application/pdf
                        - image/jpeg
                        - image/png
                        - image/webp
                size:
                    type: integer
                    minimum: 1
                    maximum: 5242880
                documentType:
                    type: string
                    enum:
                        - user_document
                        - driver_license
                uploadedAt:
                    type: string
                    format: date-time

        DeliveryProof:
            type: object
            nullable: true
            required:
                - originalName
                - filename
                - mimetype
                - size
                - documentType
            properties:
                _id:
                    type: string
                originalName:
                    type: string
                    example: comprobante.pdf
                filename:
                    type: string
                    example: 4be103af-1ce8-4ea3-81f5-0ef9f67c5a15.pdf
                mimetype:
                    type: string
                    enum:
                        - application/pdf
                        - image/jpeg
                        - image/png
                        - image/webp
                size:
                    type: integer
                    minimum: 1
                    maximum: 5242880
                documentType:
                    type: string
                    enum:
                        - delivery_proof
                uploadedAt:
                    type: string
                    format: date-time

        Order:
            type: object
            properties:
                _id:
                    type: string
                    example: "507f1f77bcf86cd799439012"
                userId:
                    oneOf:
                        - type: string
                          example: "507f1f77bcf86cd799439011"
                        - $ref: "#/components/schemas/UserSummary"
                deliveryAddress:
                    type: string
                    example: "Av. Siempre Viva 123"
                total:
                    type: number
                    minimum: 0
                    example: 125.50
                status:
                    type: string
                    enum:
                        - created
                        - assigned
                        - picked_up
                        - in_transit
                        - delivered
                        - cancelled
                    example: created
                priority:
                    type: string
                    enum:
                        - low
                        - normal
                        - high
                    example: normal
                isActive:
                    type: boolean
                    example: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        Delivery:
            type: object
            properties:
                _id:
                    type: string
                    example: "507f1f77bcf86cd799439013"
                order:
                    description: Puede estar poblado o ser null si la referencia no existe.
                    oneOf:
                        - type: string
                          example: "507f1f77bcf86cd799439012"
                        - $ref: "#/components/schemas/Order"
                    nullable: true
                deliveryPerson:
                    description: Puede estar poblado o ser null si la referencia no existe.
                    oneOf:
                        - type: string
                          example: "507f1f77bcf86cd799439014"
                        - $ref: "#/components/schemas/UserSummary"
                    nullable: true
                status:
                    type: string
                    enum:
                        - pending
                        - assigned
                        - in_transit
                        - delivered
                        - cancelled
                    example: pending
                address:
                    type: string
                    example: "Av. Siempre Viva 123"
                estimatedDeliveryDate:
                    type: string
                    format: date-time
                    example: "2026-10-10T18:00:00.000Z"
                proof:
                    $ref: "#/components/schemas/DeliveryProof"
                isActive:
                    type: boolean
                    example: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        Product:
            type: object
            properties:
                _id:
                    type: string
                    example: "507f1f77bcf86cd799439015"
                name:
                    type: string
                    example: "Mouse inalámbrico"
                price:
                    type: number
                    minimum: 0
                    example: 25.99
                stock:
                    type: number
                    minimum: 0
                    example: 10
                status:
                    type: string
                    enum:
                        - AVAILABLE
                        - OUT_OF_STOCK
                    example: AVAILABLE
                isActive:
                    type: boolean
                    example: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        ErrorResponse:
            type: object
            properties:
                status:
                    type: string
                    example: error
                error:
                    type: string
                    example: USER_NOT_FOUND
                message:
                    type: string
                    example: "No se encontró el usuario solicitado."
                details:
                    oneOf:
                        - type: string
                        - type: object
                    description: Información adicional incluida en desarrollo cuando existe.

        SuccessResponse:
            type: object
            required:
                - status
                - message
            properties:
                status:
                    type: string
                    enum:
                        - success
                    example: success
                message:
                    type: string
                    example: "Operación realizada correctamente."

        HealthResponse:
            type: object
            required:
                - status
                - environment
                - uptime
                - timestamp
            properties:
                status:
                    type: string
                    enum:
                        - ok
                        - error
                    example: ok
                environment:
                    type: string
                    enum:
                        - development
                        - test
                        - production
                    example: production
                uptime:
                    type: number
                    minimum: 0
                    example: 3600.25
                timestamp:
                    type: string
                    format: date-time
