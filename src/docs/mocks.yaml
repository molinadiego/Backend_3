/api/mocks/users:
    get:
        tags:
            - Mocks
        summary: Generar usuarios de prueba
        description: Genera usuarios ficticios en memoria sin almacenarlos en MongoDB. La cantidad debe ser un entero entre 1 y 50; valores mayores se rechazan con INVALID_MOCK_AMOUNT. El valor por defecto es 5.
        parameters:
            - name: qty
              in: query
              required: false
              description: Cantidad de usuarios a generar.
              schema:
                   type: integer
                   minimum: 1
                   maximum: 50
                   default: 5
                   example: 3
        responses:
            "200":
                description: Usuarios generados correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                payload:
                                    type: array
                                    items:
                                        $ref: "#/components/schemas/User"
            "400":
                description: Cantidad de registros no válida.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"

