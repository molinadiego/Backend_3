/api/mocks/seed:
    post:
        tags:
            - Mocks
        summary: Insertar datos de prueba
        description: Disponible en los entornos development y test. En production, el middleware responde 404 y no ejecuta la carga de datos. En los entornos habilitados, genera e inserta usuarios, repartidores, pedidos y entregas de prueba en MongoDB. Úsalo únicamente con una base de pruebas controlada. Las cantidades pueden enviarse mediante query parameters o mediante el body en formato JSON; si se envía el mismo parámetro por ambos medios, prevalece query. Cada cantidad debe ser un entero entre 0 y 50; los valores mayores se rechazan con INVALID_MOCK_AMOUNT.
        parameters:
            - name: users
              in: query
              required: false
              description: Cantidad de usuarios clientes a insertar. Por defecto 5.
              schema:
                    type: integer
                    minimum: 0
                    maximum: 50
                    default: 5
                    example: 2
            - name: deliveryPersons
              in: query
              required: false
              description: Cantidad de repartidores a insertar. Por defecto 3.
              schema:
                    type: integer
                    minimum: 0
                    maximum: 50
                    default: 3
                    example: 1
            - name: orders
              in: query
              required: false
              description: Cantidad de pedidos a insertar. Por defecto 10.
              schema:
                    type: integer
                    minimum: 0
                    maximum: 50
                    default: 10
                    example: 2
            - name: deliveries
              in: query
              required: false
              description: Cantidad de entregas a insertar. Por defecto 5.
              schema:
                    type: integer
                    minimum: 0
                    maximum: 50
                    default: 5
                    example: 1
        requestBody:
            required: false
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            users:
                                type: integer
                                minimum: 0
                                maximum: 50
                                example: 2
                            deliveryPersons:
                                type: integer
                                minimum: 0
                                maximum: 50
                                example: 1
                            orders:
                                type: integer
                                minimum: 0
                                maximum: 50
                                example: 2
                            deliveries:
                                type: integer
                                minimum: 0
                                maximum: 50
                                example: 1

        responses:
            "201":
                description: Datos de prueba insertados correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                payload:
                                    type: object
                                    properties:
                                        usersInserted:
                                            type: integer
                                            example: 2
                                        deliveryPersonsInserted:
                                            type: integer
                                            example: 1
                                        ordersInserted:
                                            type: integer
                                            example: 2
                                        deliveriesInserted:
                                            type: integer
                                            example: 1
            "400":
                description: Cantidad inválida o combinación de cantidades que no permite establecer las relaciones requeridas.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "404":
                description: Ruta no encontrada cuando NODE_ENV es production; el controller no se ejecuta.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
