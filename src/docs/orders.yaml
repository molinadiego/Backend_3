/api/orders:
    get:
        tags:
            - Orders
        summary: Obtener todos los pedidos
        description: Obtiene todos los pedidos activos registrados en ShipNow.
        responses:
            "200":
                description: Lista de pedidos obtenida correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                payload:
                                    type: array
                                    items:
                                        $ref: "#/components/schemas/Order"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"

    post:
        tags:
            - Orders
        summary: Crear un pedido
        description: Crea un nuevo pedido en ShipNow.
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - userId
                            - deliveryAddress
                            - total
                        properties:
                            userId:
                                type: string
                                description: Identificador del usuario que realiza el pedido.
                                example: "507f1f77bcf86cd799439011"
                            deliveryAddress:
                                type: string
                                example: "Av. Siempre Viva 123"
                            total:
                                type: number
                                minimum: 0
                                example: 125.50
                            status:
                                type: string
                                enum:
                                    - created
                                    - assigned
                                    - picked_up
                                    - in_transit
                                    - delivered
                                    - cancelled
                                example: created
                            priority:
                                type: string
                                enum:
                                    - low
                                    - normal
                                    - high
                                example: normal
                            isActive:
                                type: boolean
                                example: true
        responses:
            "201":
                description: Pedido creado correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                payload:
                                    $ref: "#/components/schemas/Order"
            "400":
                description: Datos enviados no válidos.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"

/api/orders/{id}:
    get:
        tags:
            - Orders
        summary: Obtener un pedido por ID
        description: Obtiene un pedido activo utilizando su identificador.
        parameters:
            - name: id
              in: path
              required: true
              description: Identificador del pedido.
              schema:
                  type: string
                  example: "507f1f77bcf86cd799439012"
        responses:
            "200":
                description: Pedido obtenido correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                payload:
                                    $ref: "#/components/schemas/Order"
            "404":
                description: Pedido no encontrado.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"

    put:
        tags:
            - Orders
        summary: Actualizar un pedido
        description: Actualiza los datos de un pedido existente.
        parameters:
            - name: id
              in: path
              required: true
              description: Identificador del pedido.
              schema:
                  type: string
                  example: "507f1f77bcf86cd799439012"
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            userId:
                                type: string
                                example: "507f1f77bcf86cd799439011"
                            deliveryAddress:
                                type: string
                                example: "Av. Siempre Viva 456"
                            total:
                                type: number
                                minimum: 0
                                example: 150.00
                            status:
                                type: string
                                enum:
                                    - created
                                    - assigned
                                    - picked_up
                                    - in_transit
                                    - delivered
                                    - cancelled
                                example: assigned
                            priority:
                                type: string
                                enum:
                                    - low
                                    - normal
                                    - high
                                example: high
                            isActive:
                                type: boolean
                                example: true
        responses:
            "200":
                description: Pedido actualizado correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                payload:
                                    $ref: "#/components/schemas/Order"
            "400":
                description: Datos enviados no válidos.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "404":
                description: Pedido no encontrado.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"

    delete:
        tags:
            - Orders
        summary: Eliminar un pedido
        description: Desactiva un pedido mediante eliminación lógica.
        parameters:
            - name: id
              in: path
              required: true
              description: Identificador del pedido.
              schema:
                  type: string
                  example: "507f1f77bcf86cd799439012"
        responses:
            "200":
                description: Pedido eliminado correctamente.
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                status:
                                    type: string
                                    example: success
                                payload:
                                    $ref: "#/components/schemas/Order"
            "404":
                description: Pedido no encontrado.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
            "500":
                description: Error interno del servidor.
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ErrorResponse"
